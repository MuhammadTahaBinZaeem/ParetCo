name: ParetoCo CI

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript and modular launch pipeline
        run: npm run check
